name: Setup build environment
description: >
  Install OS-native electron-builder dependencies (Linux), Node.js, and restore the
  Electron/electron-builder download caches. Shared by ci.yml and release.yml so the
  Linux package list, Flatpak runtime version, and cache paths have one source of truth.

runs:
  using: composite
  steps:
    # xvfb is installed unconditionally here (even though only ci.yml's E2E step uses it)
    # so both workflows share one Linux package list instead of two lists that can drift.
    # It's a tiny package; installing it unused in release.yml costs nothing.
    # rpm is electron-builder's packaging tool for the `rpm` Linux target — ubuntu-latest
    # doesn't ship it by default (see electron-builder's multi-platform-build docs).
    - name: Install Linux native dependencies (electron-builder, xvfb for headless E2E)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf flatpak flatpak-builder xvfb rpm

    - name: Install Flatpak runtime (electron-builder flatpak target)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
        sudo flatpak install --system -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.electronjs.Electron2.BaseApp//25.08

    - name: Setup Node.js 24
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'

    # actions/setup-node's cache:npm only covers the npm registry cache — it doesn't touch
    # the Electron binary zip (~100-200MB) or electron-builder's own toolchain downloads
    # (NSIS, winCodeSign, etc.), which live in a separate cache dir and get re-downloaded on
    # every run otherwise. Cache path list covers all 3 OSes; actions/cache skips whichever
    # paths don't exist on the current runner, and the OS-prefixed key keeps them separate.
    - name: Cache Electron/electron-builder downloads
      uses: actions/cache@v6
      with:
        path: |
          ~/.cache/electron
          ~/.cache/electron-builder
          ~/Library/Caches/electron
          ~/Library/Caches/electron-builder
          ~\AppData\Local\electron\Cache
          ~\AppData\Local\electron-builder\Cache
        key: ${{ runner.os }}-electron-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          ${{ runner.os }}-electron-

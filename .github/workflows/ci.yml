name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Linux native dependencies (electron-builder)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf flatpak flatpak-builder xvfb

      - name: Install Flatpak runtime (electron-builder flatpak target)
        if: runner.os == 'Linux'
        run: |
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --system -y flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08 org.electronjs.Electron2.BaseApp//25.08

      # ubuntu-latest (Ubuntu 24.04+) restricts unprivileged user namespaces via AppArmor by
      # default, which breaks Electron's sandbox init entirely (electron.launch() throws before
      # producing an app handle — see electron/electron#41066, microsoft/playwright#34251). This
      # is a CI-runner-only setting; it doesn't touch the shipped app or its actual sandbox usage.
      - name: Allow Electron sandbox to init (Ubuntu 24.04 AppArmor userns restriction)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      # actions/setup-node's cache:npm only covers the npm registry cache — it doesn't touch
      # the Electron binary zip (~100-200MB) or electron-builder's own toolchain downloads
      # (NSIS, winCodeSign, etc.), which live in a separate cache dir and get re-downloaded on
      # every run otherwise. Cache path list covers all 3 OSes; actions/cache skips whichever
      # paths don't exist on the current runner, and the OS-prefixed key keeps them separate.
      - name: Cache Electron/electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        run: npm ci

      - name: Install Electron/Chromium runtime dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo npx playwright install-deps

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: E2E tests (Linux, headless via xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum -- npm run test:e2e

      - name: E2E tests
        if: runner.os != 'Linux'
        run: npm run test:e2e

      - name: Package (validates packaging without publishing/uploading)
        run: npm run package

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: Lint, typecheck, and unit test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type check
        run: npm run typecheck

      - name: Test
        run: npm run test

  validate:
    name: E2E + package (${{ matrix.os }})
    needs: lint-and-test
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup build environment (Node.js, Linux native deps, caches)
        uses: ./.github/actions/setup-build-env

      # ubuntu-latest (Ubuntu 24.04+) restricts unprivileged user namespaces via AppArmor by
      # default, which breaks Electron's sandbox init entirely (electron.launch() throws before
      # producing an app handle — see electron/electron#41066, microsoft/playwright#34251). This
      # is a CI-runner-only setting; it doesn't touch the shipped app or its actual sandbox usage.
      - name: Allow Electron sandbox to init (Ubuntu 24.04 AppArmor userns restriction)
        if: runner.os == 'Linux'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Install dependencies
        run: npm ci

      - name: Install Electron/Chromium runtime dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo npx playwright install-deps

      - name: E2E tests (Linux, headless via xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum -- npm run test:e2e

      - name: E2E tests
        if: runner.os != 'Linux'
        run: npm run test:e2e

      - name: Package (validates packaging without publishing/uploading)
        run: npm run package

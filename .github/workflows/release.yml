name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact-name: release-linux
            artifact-path: |
              build/*.AppImage
              build/*.deb
              build/*.rpm
              build/*.tar.gz
              build/*.flatpak
          - os: macos-latest
            artifact-name: release-macos
            artifact-path: |
              build/*.dmg
              build/*.zip
              build/*.pkg
          - os: windows-latest
            artifact-name: release-windows
            artifact-path: build/*.exe

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup build environment (Node.js, Linux native deps, caches)
        uses: ./.github/actions/setup-build-env

      - name: Install dependencies
        run: npm ci

      # Code signing / notarization secrets are scoped to the macOS leg only (via the
      # runner.os ternary). CSC_LINK is a *shared* electron-builder var also read on Windows;
      # leaving it unset there prevents a mac .p12 from being fed into Windows Authenticode
      # signing by mistake. See README > Releasing for what each secret is and how to set it up.
      - name: Build & package (release)
        env:
          CSC_LINK: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE_P12_BASE64 || '' }}
          CSC_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          # pkg installers sign with a separate "Developer ID Installer" certificate — the
          # app-signing cert above (CSC_LINK) can't sign .pkg. See README > Releasing.
          CSC_INSTALLER_LINK: ${{ runner.os == 'macOS' && secrets.MAC_INSTALLER_CERTIFICATE_P12_BASE64 || '' }}
          CSC_INSTALLER_KEY_PASSWORD: ${{ runner.os == 'macOS' && secrets.MAC_INSTALLER_CERTIFICATE_PASSWORD || '' }}
          APPLE_API_KEY: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_BASE64 || '' }}
          APPLE_API_KEY_ID: ${{ runner.os == 'macOS' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ runner.os == 'macOS' && secrets.APPLE_API_ISSUER || '' }}
          APPLE_TEAM_ID: ${{ runner.os == 'macOS' && secrets.APPLE_TEAM_ID || '' }}
        run: npm run release

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${{ github.ref_name }}"
          if gh release view "$tag" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/* --repo "${{ github.repository }}" --clobber
          else
            gh release create "$tag" artifacts/* --repo "${{ github.repository }}" --title "$tag" --generate-notes
          fi
